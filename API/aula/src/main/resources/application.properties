spring.application.name=aula-sb

# URL de conexão com o PostgreSQL (substitua 'nome_do_banco' pelo seu banco)
spring.datasource.url=jdbc:postgresql://localhost:5432/estudos_db

# Credenciais de acesso
spring.datasource.username=pedrolucas
spring.datasource.password=123456

# Driver do PostgreSQL (opcional nas versões mais recentes, mas recomendado)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect